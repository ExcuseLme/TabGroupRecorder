<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>标签组管理</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- t0:静态壳,同步渲染,不等待任何 storage / API -->
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="current" id="tab-current">当前标签</button>
    <button class="tab" data-tab="records" id="tab-records">快照记录</button>
  </nav>

  <header class="header" id="header">
    <div class="title-group">
      <h1 class="title" id="header-title">当前标签</h1>
      <!-- 展开/折叠全部标签组(紧邻主标题右方;hover 提示见 setHeader) -->
      <button class="icon-btn fold-all" id="btn-fold-all" aria-label="展开/收起全部"></button>
      <span class="subtitle" id="header-sub">(当前窗口中的所有标签和分组)</span>
    </div>
    <!-- 当前标签 tab:捕获全部(补充需求1) -->
    <div class="actions" id="capture-all-wrap">
      <button class="text-btn" id="btn-capture-all">捕获全部</button>
    </div>
    <!-- 快照记录 tab:正则搜索 + 纯文本导出/导入 -->
    <div class="actions" id="header-actions" hidden>
      <button class="text-btn" id="btn-search" title="搜索快照(正则)">搜索</button>
      <button class="text-btn" id="btn-export">导出</button>
      <button class="text-btn" id="btn-import">导入</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden />

      <!-- 搜索覆盖层:绝对定位覆盖「搜索/导出/导入」三按钮;从搜索按钮左缘向右展开 -->
      <div class="search-overlay" id="search-overlay" hidden>
        <input type="text" id="search-input" placeholder="正则搜索…" spellcheck="false"
               autocomplete="off" maxlength="512" aria-label="正则搜索快照" />
      </div>
    </div>
  </header>

  <!-- 列表:t0 先渲染骨架,t1 异步填充 -->
  <main class="list" id="list" tabindex="0"></main>

  <!-- 面板高度调整手柄(§1.4):拖动改高、双击复原;键盘 ↑/↓ 微调 -->
  <div class="resize-handle" id="resize-handle" role="separator" aria-orientation="horizontal"
       tabindex="0" title="拖动调整面板高度,双击恢复自动">
    <span class="badge" id="resize-badge" hidden></span>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="src/popup.js"></script>
</body>
</html>
